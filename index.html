// Fit using actual font sizes and spacing, never CSS zoom or transforms.
const printVars=['--body-size','--title-size','--table-size','--gap','--logo-height','--row-pad','--sign-gap'];
function preparePrint(){
 const p=$('paper');if(!p||!p.innerHTML)return;
 p.classList.add('print-layout');printVars.forEach(v=>p.style.removeProperty(v));
 const available=265*96/25.4;
 for(let i=0;i<=12;i++){
  const values=[Math.max(8,11-i*.25)+'pt',Math.max(13,17-i*.3)+'pt',Math.max(7,10.5-i*.3)+'pt',Math.max(1,3-i*.2)+'mm',Math.max(15,27-i)+'mm',Math.max(.15,1.5-i*.12)+'mm',Math.max(5,15-i)+'mm'];
  printVars.forEach((v,j)=>p.style.setProperty(v,values[j]));
  if(p.getBoundingClientRect().height<=available)break;
 }
}
window.addEventListener('beforeprint',preparePrint);
window.addEventListener('afterprint',()=>{const p=$('paper');if(p){p.classList.remove('print-layout');printVars.forEach(v=>p.style.removeProperty(v))}});
async function downloadDeclarationPDF(){
 const p=$('paper');if(!p||!p.innerHTML)return alert('Gere a declaração primeiro.');
 try{
 const W=595.28,H=841.89,L=42,R=W-L, width=R-L;
 const enc=s=>{const map={'–':150,'—':151,'‘':145,'’':146,'“':147,'”':148,'€':128,'…':133};return Array.from(String(s).normalize('NFC')).map(c=>{let n=map[c]??c.charCodeAt(0);return (n<=255?n:63).toString(16).padStart(2,'0')}).join('')};
 const cv=document.createElement('canvas'),ctx=cv.getContext('2d');
 const measure=(s,size,b=false)=>{ctx.font=`${b?'bold ':''}${size}px Arial`;return ctx.measureText(s).width};
 let logo=null;const img=p.querySelector('img');if(img){await img.decode();let c=document.createElement('canvas');let ratio=Math.min(1,1200/Math.max(img.naturalWidth,img.naturalHeight));c.width=Math.max(1,Math.round(img.naturalWidth*ratio));c.height=Math.max(1,Math.round(img.naturalHeight*ratio));let g=c.getContext('2d');g.fillStyle='white';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);logo={w:c.width,h:c.height,bytes:atob(c.toDataURL('image/jpeg',.96).split(',')[1])};}
 const paragraphs=[...p.querySelectorAll(':scope > p')], date=paragraphs.pop().innerText, rows=[...p.querySelectorAll('table tr')].map(r=>[...r.cells].map(c=>c.innerText)), signs=[...p.querySelectorAll('.sign > div')].map(d=>d.innerText.split('\n'));
 let ops=[], y;const f=n=>Number(n.toFixed(3));
 const text=(s,x,top,size,b=false,align='left')=>{let w=measure(s,size,b);if(align==='center')x-=w/2;if(align==='right')x-=w;ops.push(`BT /${b?'F2':'F1'} ${f(size)} Tf 1 0 0 1 ${f(x)} ${f(H-top-size)} Tm <${enc(s)}> Tj ET`)};
 const line=(x1,x2,top)=>ops.push(`0.55 G 0.45 w ${f(x1)} ${f(H-top)} m ${f(x2)} ${f(H-top)} l S 0 G`);
 const wrap=(s,size,max,b=false)=>{let out=[];for(let part of s.split('\n')){let curr='';for(let word of part.split(/\s+/)){let test=curr?curr+' '+word:word;if(curr&&measure(test,size,b)>max){out.push(curr);curr=word}else curr=test;while(measure(curr,size,b)>max&&curr.length>1){let i=curr.length-1;while(i>1&&measure(curr.slice(0,i),size,b)>max)i--;out.push(curr.slice(0,i));curr=curr.slice(i)}}out.push(curr)}return out};
 function layout(k){ops=['0 G 0 g'];y=38;let s=11*k, leading=15*k;
 if(logo){let scale=Math.min(140*k/logo.w,76*k/logo.h),w=logo.w*scale,h=logo.h*scale;ops.push(`q ${f(w)} 0 0 ${f(h)} ${f((W-w)/2)} ${f(H-y-h)} cm /Im1 Do Q`);y+=h+14*k;}
 text('DECLARAÇÃO DE FATURAMENTO',W/2,y,17*k,true,'center');y+=30*k;
 for(let para of paragraphs){for(let ln of wrap(para.innerText,s,width)){text(ln,L,y,s);y+=leading;}y+=7*k;}
 let rh=20*k, edges=[L,L+width*.34,L+width*.56,L+width*.78,R];
 rows.forEach((row,i)=>{let bold=i===0||i===rows.length-1;if(bold)ops.push(`0.92 g ${f(L)} ${f(H-y-rh)} ${f(width)} ${f(rh)} re f 0 g`);row.forEach((v,j)=>{let size=10.5*k, max=edges[j+1]-edges[j]-10;while(measure(v,size,bold)>max&&size>2)size-=.2;text(v,j===0?L+5:edges[j+1]-5,y+(rh-size)/2-1,size,bold,j===0?'left':'right')});y+=rh;line(L,R,y)});
 y+=12*k;for(let ln of wrap(date,s,width)){text(ln,R,y,s,false,'right');y+=leading;}y+=40*k;
 let start=y, half=(width-22)/2;signs.forEach((arr,i)=>{let x=L+i*(half+22),t=start;line(x,x+half,t);t+=5*k;arr.forEach((v,j)=>{for(let ln of wrap(v,10.5*k,half,j===0)){text(ln,x+half/2,t,10.5*k,j===0,'center');t+=14*k;}});y=Math.max(y,t)});return y;}
 let k=1;while(layout(k)>H-38&&k>.15)k*=.95;if(y>H-38)throw Error('Período muito extenso. Selecione menos competências.');
 const stream=ops.join('\n');let objects=[null,'<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>',`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> ${logo?'/XObject << /Im1 7 0 R >>':''} >> /Contents 6 0 R >>`,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>',`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`];if(logo)objects.push(`<< /Type /XObject /Subtype /Image /Width ${logo.w} /Height ${logo.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${logo.bytes.length} >>\nstream\n${logo.bytes}\nendstream`);
 let pdf='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n',offsets=[0];for(let i=1;i<objects.length;i++){offsets.push(pdf.length);pdf+=`${i} 0 obj\n${objects[i]}\nendobj\n`;}let xref=pdf.length;pdf+=`xref\n0 ${objects.length}\n0000000000 65535 f \n`+offsets.slice(1).map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objects.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
 let url=URL.createObjectURL(new Blob([Uint8Array.from(pdf,c=>c.charCodeAt(0))],{type:'application/pdf'}));let a=document.createElement('a');a.href=url;a.download='Declaracao_de_Faturamento.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);
 }catch(e){alert('Não foi possível gerar o PDF: '+e.message);}
}



let pgRows=[];
function pgParse(raw){
 const t=raw.replace(/\s+/g,' '), num='[\\d.]+,\\d{2}', val=x=>Math.round(Number(x.replace(/\./g,'').replace(',','.'))*100), pa=t.match(/Período de Apuração\s*\(PA\):\s*(\d{2}\/\d{4})/i), base=t.match(/CNPJ Básico:\s*([\d.]+)/i);
 if(!pa||!base||!t.includes('PGDAS-D'))throw Error('Extrato PGDAS-D não reconhecido.');
 const rpa=t.match(new RegExp('Receita Bruta do PA \\(RPA\\)\\s*-\\s*Competência\\s+('+num+')\\s+('+num+')\\s+('+num+')','i'));
 if(!rpa||val(rpa[1])+val(rpa[2])!==val(rpa[3]))throw Error('Receita por competência não identificada ou divergente.');
 if(!/Regime de Apuração:\s*Competência/i.test(t))throw Error('Regime de caixa ou desconhecido: confira e lance manualmente.');
 const section=t.split(/3\)\s*Informações dos Estabelecimentos/i)[1]?.split(/4\)\s*Total Geral/i)[0];if(!section)throw Error('Estabelecimentos não identificados.');
 const parts=section.split(/CNPJ Estabelecimento:\s*/i).slice(1), rows=[];let total=0;
 for(const p of parts){const cnpj=p.match(/^([\d.\/\-]{18})/)?.[1];if(!cnpj||digits(cnpj).slice(0,8)!==digits(base[1]))throw Error('CNPJ inconsistente.');let a=0,b=0,u=0;const activities=p.split(/Valor do Débito por Tributo para a Atividade\s*\(R\$\):/i).slice(1);for(const s of activities){const m=s.match(new RegExp('Receita Bruta Informada:\\s*R\\$\\s*('+num+')','i'));if(!m)throw Error('Receita da atividade não identificada.');const desc=s.slice(0,m.index),v=val(m[1]);if(/presta[çc][ãa]o de servi[çc]os/i.test(desc))b+=v;else if(/revenda de mercadorias/i.test(desc))a+=v;else u+=v;}const subtotal=p.match(new RegExp('Valor Informado:\\s*('+num+')','i'));if(!subtotal||val(subtotal[1])!==a+b+u)throw Error('Receitas do estabelecimento não conferem.');total+=a+b+u;rows.push({cnpj,pa:pa[1],a,b,u,total:a+b+u,source:'Atividades do PA'});}
 if(!rows.length||total!==val(rpa[3]))throw Error('Soma dos estabelecimentos diverge da RPA.');
 const hist=t.split(/2\.2\)\s*Receitas Brutas Anteriores/i)[1]?.split(/2\.3\)/)[0];if(hist){const map=new Map();for(const [i,s] of hist.split(/2\.2\.[12]\)\s*Mercado (?:Interno|Externo)/i).slice(1).entries()){for(const m of s.matchAll(new RegExp('(\\d{2}/\\d{4})\\s+('+num+')','g'))){const old=map.get(m[1])||[null,null];old[i]=val(m[2]);map.set(m[1],old);}}for(const [period,v] of map){if(v.some(x=>x===null)||period===pa[1])continue;const amount=v[0]+v[1];rows.push({cnpj:rows.length&&parts.length===1?rows[0].cnpj:'',base:digits(base[1]),pa:period,a:0,b:0,u:amount,total:amount,source:'Histórico consolidado — classificação manual'});}}
 return rows;
}
function pgPage(){pgRows=[];set(head('Importar PGDAS-D','Leia extratos PDF e confira os valores antes de salvar.')+`<div class="panel"><label>Extratos PDF</label><input id="pgFiles" type="file" accept="application/pdf,.pdf" multiple><div class="actions"><button onclick="pgRead()">Ler PDFs</button></div><small>A leitura usa PDF.js carregado pela internet; o PDF é processado no dispositivo. Não envie PDFs ao GitHub. Histórico exige confirmação de estabelecimento e divisão de receitas.</small><p id="pgStatus"></p><details><summary>Alternativa: colar texto do extrato</summary><textarea id="pgText" rows="6" style="width:100%"></textarea><button onclick="pgPaste()">Ler texto</button></details></div><div id="pgPreview"></div>`);}
function pgPaste(){try{pgRows=pgParse($('pgText').value);pgShow();}catch(e){$('pgStatus').textContent=e.message;}}
async function pgRead(){const files=[...$('pgFiles').files];if(!files.length)return alert('Selecione um PDF.');pgRows=[];$('pgPreview').innerHTML='';const status=$('pgStatus');status.textContent='Carregando leitor…';try{const lib=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs');lib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs';let errors=[];for(const f of files){try{const pdf=await lib.getDocument({data:new Uint8Array(await f.arrayBuffer()),isEvalSupported:false}).promise;let text='';for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i),c=await p.getTextContent();text+=c.items.map(x=>x.str||'').join(' ')+' ';}pgRows.push(...pgParse(text));await pdf.destroy();}catch(e){errors.push(f.name+': '+e.message);}}status.textContent=errors.join(' | ')||'Leitura concluída. Confira os valores.';pgShow();}catch(e){status.textContent='Não foi possível carregar o leitor PDF. Verifique a internet ou use a opção de colar texto.';}}
function pgBulk(mode){const groups=new Set(pgRows.map(r=>r.base||digits(r.cnpj).slice(0,8)));if(groups.size!==1)return alert("Para classificar em lote, importe extratos de uma empresa por vez.");if(mode!=="mixed"&&!confirm("Confirma que as receitas históricas selecionadas pertencem integralmente a "+(mode==="service"?"serviços":"comércio")+"?"))return;pgRows.forEach((r,i)=>{if(!r.source.startsWith("Histórico")||!r.u||!r.cnpj||!$("pgC"+i).value)return;if(db.companies.filter(c=>digits(c.cnpj).slice(0,8)===digits(r.cnpj).slice(0,8)).length!==1)return;const a=$("pgA"+i),b=$("pgB"+i);if(mode==="mixed"){a.value="";b.value="";}else{a.value=mode==="commerce"?r.total/100:0;b.value=mode==="service"?r.total/100:0;}$("pgK"+i).checked=false;});}function pgConfirmAll(){if(!confirm("Confirma que conferiu os estabelecimentos, valores e classificação das linhas completas?"))return;let n=0;pgRows.forEach((r,i)=>{const a=$("pgA"+i).value,b=$("pgB"+i).value,id=$("pgC"+i).value;const ok=!!id&&a!==""&&b!==""&&Number.isFinite(+a)&&Number.isFinite(+b)&&+a>=0&&+b>=0&&cents(a)+cents(b)===r.total&&(!r.source.startsWith("Histórico")||!!r.cnpj&&db.companies.filter(c=>digits(c.cnpj).slice(0,8)===digits(r.cnpj).slice(0,8)).length===1);$("pgK"+i).checked=ok;if(ok)n++;});alert(n+" linha(s) confirmada(s). As demais exigem conferência individual.");}function pgShow(){if(!$('pgPreview'))return;$('pgPreview').innerHTML=`<div class="panel"><h3>Conferência</h3><small>Selecione apenas linhas conferidas. Para histórico consolidado, não atribua valores a uma filial sem verificar. Valores em reais.</small><div class="actions"><button type="button" onclick="pgBulk('service')">Histórico: 100% Serviços</button><button type="button" onclick="pgBulk('commerce')">Histórico: 100% Comércio</button><button type="button" class="secondary" onclick="pgBulk('mixed')">Atividade mista (preencher divisão)</button><button type="button" class="secondary" onclick="pgConfirmAll()">Confirmar todas as linhas completas</button></div><small>Classificação em lote somente para histórico de empresa com um estabelecimento identificado e cadastrado. Confira se não há outras filiais no período.</small>${pgRows.map((r,i)=>{const companies=db.companies.filter(c=>r.cnpj?digits(c.cnpj)===digits(r.cnpj):digits(c.cnpj).slice(0,8)===r.base);return `<div style="border-bottom:1px solid #ddd;padding:12px 0"><b>${esc(r.pa)} — ${esc(r.cnpj||r.base)}</b><br>${esc(r.source)} — Total ${money(r.total/100)}<div class="grid"><div><label>Estabelecimento</label><select id="pgC${i}"><option value="">${companies.length?"Selecione o estabelecimento":"CNPJ não cadastrado — cadastre em Empresas"}</option>${companies.map(c=>`<option value="${esc(c.id)}" ${r.cnpj&&companies.length===1&&(!r.source.startsWith("Histórico")||db.companies.filter(x=>digits(x.cnpj).slice(0,8)===digits(r.cnpj).slice(0,8)).length===1)?"selected":""}>${esc(c.name)} — ${esc(c.cnpj)}</option>`).join("")}</select></div>${field('pgA'+i,'Comércio',r.u?'':r.a/100,'number')}${field('pgB'+i,'Serviços',r.u?'':r.b/100,'number')}</div><label><input type="checkbox" style="width:auto" id="pgK${i}"> Confirmo os dados e a classificação desta competência</label></div>`}).join('')}<button onclick="pgSave()">Salvar competências confirmadas</button></div>`;}
async function pgSave(){let updates={},duplicates=0;for(const [i,r] of pgRows.entries()){if(!$('pgK'+i).checked)continue;const id=$('pgC'+i).value,a=$('pgA'+i).value,b=$('pgB'+i).value;const [m,y]=r.pa.split('/');if(!id||a===''||b===''||!Number.isFinite(+a)||!Number.isFinite(+b)||+a<0||+b<0||cents(a)+cents(b)!==r.total||+m<1||+m>12)return alert('Confira estabelecimento e soma de comércio e serviços em '+r.pa);const k=key(id,y,+m-1);if(k in updates)return alert('Há duas linhas selecionadas para a mesma competência e estabelecimento. Escolha apenas uma.');if(k in db.revenue)duplicates++;updates[k]={a:cents(a)/100,b:cents(b)/100};}if(!Object.keys(updates).length)return alert('Selecione ao menos uma linha.');if(!confirm(`Salvar ${Object.keys(updates).length} competências? ${duplicates} lançamento(s) existente(s) serão substituídos.`))return;const old=db.revenue;db.revenue={...old,...updates};if(!await save())return;alert('Importação concluída.');revenue();}
